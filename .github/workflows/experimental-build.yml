name: Experimental Cartopia build

on:
  push:
    branches:
      - feature/multizone-streaming
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-1201:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 for Minecraft 1.20.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Forge jar
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace
      - name: Upload experimental jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cartopia-multizone-mc1.20.1-forge47
          path: build/libs/*.jar
          if-no-files-found: error
